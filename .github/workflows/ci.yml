name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  backend:
    name: Backend and Prisma
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/epickem?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx prisma validate

  sync-repository:
    name: Sync to deployment repository
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    # Synchronisation uniquement après un push réussi sur main
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to destination repository
        env:
          TOKEN: ${{ secrets.SCHOOL_REPO_TOKEN }}
        run: |
          git remote add destination \
            https://x-access-token:${TOKEN}@github.com/EpitechPGE3-2026/G-PRO-500-PAR-5-1-professionalwork-15.git

          git push destination HEAD:main
