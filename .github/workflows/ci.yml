name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    if: github.repository == 'UndertakerO-O/G-PRO-500-PAR-5-1-EPIckem'
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  backend:
    if: github.repository == 'UndertakerO-O/G-PRO-500-PAR-5-1-EPIckem'
    name: Backend and Prisma
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/epickem?schema=public

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        run: npx prisma validate

  sync-repository:
    name: Sync to school repository
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    if: success() && github.repository == 'UndertakerO-O/G-PRO-500-PAR-5-1-EPIckem' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
      - name: Push to school repository
        env:
          MIRROR_URL: ${{ vars.MIRROR_URL }}
        run: |
          git remote add school "$MIRROR_URL"
          git push --force school HEAD:refs/heads/main