name: Sync validated code to Epitech

on:
  workflow_run:
    workflows: [Continuous Integration]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sync-epitech-main
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Push to Epitech repository
        env:
          EPITECH_PUSH_TOKEN: ${{ secrets.EPITECH_PUSH_TOKEN }}
        run: |
          test -n "$EPITECH_PUSH_TOKEN"
          git remote add epitech "https://x-access-token:${EPITECH_PUSH_TOKEN}@github.com/EpitechPGE3-2026/G-PRO-500-PAR-5-1-professionalwork-15.git"
          git push epitech HEAD:main
